name: Update publications

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh publications from Google Scholar
        run: python scripts/update_publications.py
      - name: Commit publication updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update publications from Google Scholar"
          file_pattern: data/publications.json
